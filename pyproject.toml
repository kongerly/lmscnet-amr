[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["code/tests"]
pythonpath = ["code/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["code/src", "code/tests", "code/scripts"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
